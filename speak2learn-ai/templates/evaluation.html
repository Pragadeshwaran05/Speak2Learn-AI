{% extends 'base.html' %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/evaluation.css') }}">
{% endblock %}

{% block content %}
<div class="evaluation-room">
    <header class="room-header">
        <h2>Topic: <span id="current-topic">{{ topic }}</span></h2>
        <button id="back-to-tutor-btn" class="btn-secondary">Return to Tutor</button>
    </header>

    <div class="eval-container">
        <div id="question-card" class="card">
            <h3>AI Question</h3>
            <div id="question-text" class="question-text">Generating question... 🧠 Thinking...</div>
            <button class="listen-btn hidden" id="listen-question-btn">🔊 Listen</button>
        </div>

        <div id="answer-section" class="card hidden">
            <h3>Your Answer</h3>
            <div class="input-area eval-input">
                <button id="mic-btn" class="mic-btn eval-mic" title="Click to speak answer">🎤</button>
                <div class="text-input-container">
                    <textarea id="answer-input" placeholder="Type your answer here..." rows="4"></textarea>
                </div>
            </div>
            <button id="submit-answer-btn" class="btn-primary" style="margin-top: 15px;">Submit Answer</button>
            <div id="status-text" class="status-text"></div>
        </div>

        <div id="result-section" class="result-card hidden">
            <h2 class="score-title">Understanding Score</h2>
            <div id="score-display" class="score-display">--%</div>
            <div id="understanding-level" class="understanding-level"></div>
            
            <div class="result-details">
                <div class="strengths">
                    <h4>Strengths</h4>
                    <ul id="strengths-list"></ul>
                </div>
                <div class="weaknesses">
                    <h4>Needs Improvement</h4>
                    <ul id="weaknesses-list"></ul>
                </div>
            </div>

            <div class="feedback-section">
                <h4>AI Feedback</h4>
                <p id="feedback-text"></p>
                <button class="listen-btn" id="listen-feedback-btn">🔊 Listen</button>
            </div>

            <div class="actions">
                <button id="next-question-btn" class="btn-primary">Next Question</button>
            </div>
        </div>
    </div>
</div>

<script>
    const SESSION_ID = {{ session_id }};
</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/evaluation.js') }}"></script>
{% endblock %}
